services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: connecter
      POSTGRES_PASSWORD: connecter
      POSTGRES_DB: connecter
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecter"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  pgdata:
  qdrant:
