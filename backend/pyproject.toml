[project]
name = "connecter-backend"
version = "0.1.0"
description = "Local-first AI computer agent with MCP and agentic RAG"
requires-python = ">=3.11"
dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # DB
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  # Agent
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "mcp>=1.12",
  "openai>=1.40",
  # RAG
  "qdrant-client>=1.12",
  "fastembed>=0.5",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  # Web
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  # Browser
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
